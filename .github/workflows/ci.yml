name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (backend + flood-ml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          for req in backend/requirements.txt flood-ml/requirements.txt; do
            if [ -f "$req" ]; then pip install -r "$req"; fi
          done

      - name: Lint (ruff)
        run: ruff check backend flood-ml

      - name: Test (pytest)
        run: |
          if find backend flood-ml -name 'test_*.py' -o -name '*_test.py' | grep -q .; then
            pytest backend flood-ml
          else
            echo "No tests yet, skipping."
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: "22"

      - name: Install, lint and build
        if: hashFiles('frontend/package.json') != ''
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint --if-present
          npm run build --if-present

      - name: No frontend yet
        if: hashFiles('frontend/package.json') == ''
        run: echo "frontend/package.json not found, skipping."
