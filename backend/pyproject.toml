[project]
name = "floodmark-pipeline"
version = "0.1.0"
description = "Floodmark camera capture and inference pipeline"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10,<4",
  "arq>=0.26,<1",
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "numpy>=2.0,<3",
  "onnxruntime>=1.19,<2",
  "Pillow>=10.4,<12",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
