services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  scheduler:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: arq floodmark_pipeline.scheduler.SchedulerSettings
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: arq floodmark_pipeline.worker.WorkerSettings
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Replays scripted frames for DEMO cameras. Start with: docker compose --profile demo up -d
  demo:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: python -m floodmark_pipeline.demo_replay
    environment:
      DEMO_FRAMES_DIR: /frames
    volumes:
      - ./demo_frames:/frames:ro

volumes:
  redis-data:
